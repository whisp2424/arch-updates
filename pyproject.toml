[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch-updates"
version = "0.1.0"
description = "Arch Linux updates, cleanup tasks, and news checks"
requires-python = ">=3.11"
dependencies = [
    "colorama",
    "tomli-w",
]

[project.scripts]
arch-updates = "arch_updates.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_updates"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
exclude = ["src/arch_updates/__pycache__"]


